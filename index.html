<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-container">
    <header class="form-header">
      <h1 class="form-title">Create Your Account</h1>
      <p class="form-subtitle">Please fill in your details to register.</p>
    </header>

    <!-- Success Message Banner -->
    <div id="successBanner" class="success-banner" role="alert" aria-live="polite" style="display: none;">
      <span class="success-icon">&#10004;</span>
      <span class="success-text">Registration successful!</span>
    </div>

    <form id="registrationForm" novalidate>
      <div class="form-grid">

        <!-- 1. Full Name -->
        <div class="form-group" id="group-fullname">
          <label for="fullname" class="form-label">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="fullname" 
            name="fullname" 
            class="form-control" 
            placeholder="Enter your full name"
            autocomplete="name"
          >
          <span class="error-text" id="error-fullname"></span>
        </div>

        <!-- 2. Email Address -->
        <div class="form-group" id="group-email">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="Enter your email address"
            autocomplete="email"
          >
          <span class="error-text" id="error-email"></span>
        </div>

        <!-- 3. Phone Number -->
        <div class="form-group" id="group-phone">
          <label for="phone" class="form-label">Phone Number <span class="required">*</span></label>
          <div class="phone-input-wrapper">
            <span class="phone-prefix">+91</span>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              class="form-control phone-input" 
              placeholder="Enter 10-digit mobile number"
              maxlength="10"
              autocomplete="tel"
            >
          </div>
          <span class="error-text" id="error-phone"></span>
        </div>

        <!-- 4. Date of Birth -->
        <div class="form-group" id="group-dob">
          <label for="dob" class="form-label">Date of Birth <span class="required">*</span></label>
          <input 
            type="date" 
            id="dob" 
            name="dob" 
            class="form-control"
          >
          <span class="error-text" id="error-dob"></span>
        </div>

        <!-- 5. Password -->
        <div class="form-group" id="group-password">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control password-input" 
              placeholder="Enter password"
              autocomplete="new-password"
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="password-toggle-btn" 
              aria-label="Toggle password visibility"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-text" id="error-password"></span>
        </div>

        <!-- 6. Confirm Password -->
        <div class="form-group" id="group-confirmPassword">
          <label for="confirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              class="form-control password-input" 
              placeholder="Re-enter password"
              autocomplete="new-password"
            >
            <button 
              type="button" 
              id="toggleConfirmPassword" 
              class="password-toggle-btn" 
              aria-label="Toggle confirm password visibility"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-text" id="error-confirmPassword"></span>
        </div>

        <!-- 7. Gender -->
        <div class="form-group full-width" id="group-gender">
          <label class="form-label">Gender <span class="required">*</span></label>
          <div class="radio-options" role="radiogroup" aria-labelledby="group-gender">
            <label class="radio-label">
              <input type="radio" name="gender" value="Male" class="radio-input">
              <span>Male</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="Female" class="radio-input">
              <span>Female</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="Other" class="radio-input">
              <span>Other</span>
            </label>
          </div>
          <span class="error-text" id="error-gender"></span>
        </div>

        <!-- 8. Residential Address -->
        <div class="form-group full-width" id="group-address">
          <label for="address" class="form-label">Residential Address <span class="required">*</span></label>
          <textarea 
            id="address" 
            name="address" 
            class="form-control textarea-control" 
            rows="3" 
            placeholder="Enter your complete residential address"
          ></textarea>
          <span class="error-text" id="error-address"></span>
        </div>

        <!-- 9. City -->
        <div class="form-group" id="group-city">
          <label for="city" class="form-label">City <span class="required">*</span></label>
          <input 
            type="text" 
            id="city" 
            name="city" 
            class="form-control" 
            placeholder="Enter your city"
          >
          <span class="error-text" id="error-city"></span>
        </div>

        <!-- 10. State -->
        <div class="form-group" id="group-state">
          <label for="state" class="form-label">State <span class="required">*</span></label>
          <select id="state" name="state" class="form-control select-control">
            <option value="">-- Select State --</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
            <option value="Delhi">Delhi (NCT)</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Ladakh">Ladakh</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Puducherry">Puducherry</option>
          </select>
          <span class="error-text" id="error-state"></span>
        </div>

        <!-- 11. PIN Code -->
        <div class="form-group" id="group-pincode">
          <label for="pincode" class="form-label">PIN Code <span class="required">*</span></label>
          <input 
            type="text" 
            id="pincode" 
            name="pincode" 
            class="form-control" 
            placeholder="Enter 6-digit PIN code"
            maxlength="6"
          >
          <span class="error-text" id="error-pincode"></span>
        </div>

        <!-- 12. Terms and Conditions -->
        <div class="form-group full-width" id="group-terms">
          <label class="checkbox-label">
            <input type="checkbox" id="terms" name="terms" class="checkbox-input">
            <span>I agree to the Terms and Conditions <span class="required">*</span></span>
          </label>
          <span class="error-text" id="error-terms"></span>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="submit" id="submitBtn" class="btn btn-primary">Register</button>
        <button type="reset" id="resetBtn" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
